<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lecan Digit Match</title>
<style>
:root{--bg:#000;--card:#111010;--tx:#f3ead2;--mu:#9a8c66;--au:#e0b030;--au2:#a87c10;--gr:#27ae60;--rd:#eb5757;--bd:#3a2f10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:12px;max-width:560px;margin:auto}
.logo{display:block;width:230px;max-width:70%;margin:0 auto 4px}
h1{font-size:17px;margin:0 0 12px;text-align:center;color:var(--au);letter-spacing:2px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;color:var(--mu);font-size:12px;margin:8px 0 3px}
input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:#000;color:var(--tx);font-size:15px}
button{background:linear-gradient(#f0c648,var(--au2));color:#1a1200;border:0;font-weight:700;margin-top:10px;cursor:pointer}
button.g{background:var(--gr);color:#fff}button.r{background:var(--rd);color:#fff}button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{margin:0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:linear-gradient(#f0c648,var(--au2));color:#1a1200}
.row{display:flex;gap:8px}.row>*{flex:1}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:110px;margin-top:10px}
.bar{background:var(--au2);border-radius:4px 4px 0 0;min-height:2px}
.bar.top{background:var(--gr)}.bar.low{background:var(--rd)}
.lbls{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;text-align:center;color:var(--mu);font-size:11px;margin-top:3px}
.big{font-size:52px;font-weight:700;text-align:center;color:var(--au)}
.cur{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}
.cur div{text-align:center;padding:8px 0;border-radius:6px;background:#000;border:1px solid var(--bd)}
.cur .t{border-color:var(--au);color:var(--au)}.cur .now{background:var(--au2);color:#fff}
.cur .hit{background:var(--gr);color:#fff}
#log{max-height:180px;overflow:auto;font:12px monospace;color:var(--mu)}
.sm{font-size:12px;color:var(--mu);margin-top:6px}
a.btn{display:block;text-align:center;text-decoration:none;padding:11px;border-radius:8px;background:linear-gradient(#f0c648,var(--au2));color:#1a1200;font-weight:700}
details{margin-top:10px;color:var(--mu);font-size:13px}summary{cursor:pointer}
.hide{display:none}
</style>
</head>

<h1>Lecan Digit Match</h1>

<div class="card">
  <div id="loginBox"><button id="login" style="margin-top:0">Log in with Deriv</button></div>
  <div id="acctBox" class="hide">
    <label>Account</label><select id="acctSel"></select>
    <button id="logout" style="background:#222;color:#e0b030;border:1px solid #3a2f10">Log out</button>
  </div>
  <div class="sm" id="acc">Not connected. The analyzer works without logging in.</div>
</div>

<div class="tabs"><button id="t1" class="on">Analyzer</button><button id="t2">Bulk Trader</button></div>

<div id="p1">
  <div class="card">
    <label>Symbol</label><select id="sym1"></select>
    <label>Ticks to scan</label>
    <select id="cnt"><option>100</option><option>500</option><option selected>1000</option><option>5000</option></select>
    <button id="scan">Scan</button>
    <div class="bars" id="bars"></div><div class="lbls" id="lbls"></div>
    <div class="big" id="pred">-</div>
    <div class="sm" id="why" style="text-align:center">Press Scan</div>
  </div>
</div>

<div id="p2" class="hide">
  <div class="card">
    <label>Symbol</label><select id="sym2"></select>
    <div class="row">
      <div><label>Predicted digit</label><select id="dig"></select></div>
      <div><label>Number of trades</label><input id="num" type="number" min="1" value="5"></div>
    </div>
    <div class="row">
      <div><label>Stake</label><input id="stk" type="number" min="0.35" step="0.01" value="1"></div>
      <div><label>Duration</label><input value="1 tick" disabled></div>
    </div>
    <label>Live last digit (cursor)</label>
    <div class="cur" id="cur"></div>
    <div class="sm" id="last">Waiting for ticks...</div>
    <label style="display:flex;gap:8px;align-items:center"><input id="auto" type="checkbox" style="width:auto"> Auto-run when cursor hits the digit</label>
    <button class="g" id="run">RUN</button>
    <button class="r" id="stop">Stop</button>
  </div>
  <div class="card"><div class="sm" id="pl" style="margin:0 0 6px">Profit: 0.00 | Wins: 0 | Losses: 0</div><div id="log"></div></div>
</div>
<div class="sm" style="text-align:center;margin-bottom:20px">Trading involves risk. Digit outcomes are random; no tool can predict them.</div>

<script>
const CLIENT_ID="019d7d2f-15ad-79e8-8315-e9ec96a9100b";
const REDIRECT=location.origin+location.pathname;
const API="https://api.derivws.com",AUTH="https://auth.deriv.com/oauth2";
const PUB="wss://api.derivws.com/trading/v1/options/ws/public";
const SYMS={"Volatility 10":"R_10","Volatility 25":"R_25","Volatility 50":"R_50","Volatility 75":"R_75","Volatility 100":"R_100","Vol 10 (1s)":"1HZ10V","Vol 25 (1s)":"1HZ25V","Vol 50 (1s)":"1HZ50V","Vol 75 (1s)":"1HZ75V","Vol 100 (1s)":"1HZ100V"};
const $=id=>document.getElementById(id);
for(const s of ["sym1","sym2"])$(s).innerHTML=Object.entries(SYMS).map(([n,v])=>`<option value="${v}">${n}</option>`).join("");
$("dig").innerHTML=[...Array(10).keys()].map(i=>`<option>${i}</option>`).join("");
$("cur").innerHTML=[...Array(10).keys()].map(i=>`<div id="c${i}">${i}</div>`).join("");
const status=t=>$("acc").textContent=t;
const log=t=>{$("log").innerHTML=`${new Date().toLocaleTimeString()} ${t}<br>`+$("log").innerHTML};

// ---- WebSocket helper (id-matched requests) ----
function mkWS(url,onmsg){
  return new Promise((res,rej)=>{
    const o={pend:{},rid:1,ws:new WebSocket(url)};
    o.ws.onopen=()=>{o.ping=setInterval(()=>{try{o.ws.send(JSON.stringify({ping:1}))}catch(e){}},30000);res(o)};
    o.ws.onerror=()=>rej(new Error("WebSocket failed"));
    o.ws.onclose=()=>{clearInterval(o.ping);o.closed=true};
    o.ws.onmessage=e=>{
      const d=JSON.parse(e.data);
      if(d.req_id&&o.pend[d.req_id]){const f=o.pend[d.req_id];if(!d.subscription)delete o.pend[d.req_id];f(d)}
      if(onmsg)onmsg(d);
    };
  });
}
const send=(o,m,cb)=>{const id=o.rid++;m.req_id=id;if(cb)o.pend[id]=cb;o.ws.send(JSON.stringify(m));return id};
const ask=(o,m)=>new Promise(r=>send(o,m,r));

let pub=null,tw=null,token=null,cur="USD",accts=[],authed=false,subbed="",stopFlag=false,running=false,wins=0,losses=0,profit=0;
async function getPub(){
  if(pub&&!pub.closed)return pub;
  pub=await mkWS(PUB,d=>{if(d.msg_type==="tick")onTick(d.tick)});
  return pub;
}

// ---- Deriv OAuth 2.0 (PKCE) ----
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function login(){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const ver=Array.from(crypto.getRandomValues(new Uint8Array(64))).map(v=>chars[v%66]).join("");
  const chal=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  const state=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,"0")).join("");
  sessionStorage.setItem("pkce_v",ver);sessionStorage.setItem("oauth_state",state);
  const u=new URL(AUTH+"/auth");
  u.search=new URLSearchParams({response_type:"code",client_id:CLIENT_ID,redirect_uri:REDIRECT,scope:"trade",state,code_challenge:chal,code_challenge_method:"S256"});
  location.href=u.toString();
}
$("login").onclick=login;

async function handleCallback(){
  const q=new URLSearchParams(location.search);
  if(q.get("error")){status("Login failed: "+(q.get("error_description")||q.get("error")));history.replaceState(null,"",location.pathname);return false}
  const code=q.get("code");
  if(code){
    history.replaceState(null,"",location.pathname);
    if(q.get("state")!==sessionStorage.getItem("oauth_state")){status("Login failed: state mismatch. Try again.");return false}
    try{
      const r=await fetch(AUTH+"/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:new URLSearchParams({grant_type:"authorization_code",client_id:CLIENT_ID,code,redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem("pkce_v")})});
      const j=await r.json();
      if(!j.access_token){status("Token error: "+JSON.stringify(j).slice(0,200));return false}
      token=j.access_token;
      sessionStorage.setItem("at",token);sessionStorage.setItem("at_exp",Date.now()+(j.expires_in||3600)*1000-60000);
      sessionStorage.removeItem("pkce_v");sessionStorage.removeItem("oauth_state");
    }catch(e){status("Token request blocked or failed: "+e.message);return false}
  }else{
    const t=sessionStorage.getItem("at");
    if(t&&Date.now()<+sessionStorage.getItem("at_exp"))token=t;
  }
  return !!token;
}

const isDemo=a=>/demo|virtual/i.test(a.account_type||a.type||"")||/^(DEM|VR)/i.test(a.account_id||a.id||"");
async function loadAccounts(){
  status("Loading your accounts...");
  try{
    const r=await fetch(API+"/trading/v1/options/accounts",{headers:{Authorization:"Bearer "+token}});
    const j=await r.json();
    accts=Array.isArray(j.data)?j.data:(j.data&&j.data.accounts)||[];
    if(!r.ok||!accts.length){status("Accounts error: "+JSON.stringify(j).slice(0,200));return}
  }catch(e){status("Accounts request failed: "+e.message);return}
  $("loginBox").classList.add("hide");$("acctBox").classList.remove("hide");
  $("acctSel").innerHTML=accts.map((a,i)=>`<option value="${i}">${a.account_id||a.id} (${isDemo(a)?"DEMO":"REAL"}) ${a.currency||""}</option>`).join("");
  const d=accts.findIndex(isDemo);$("acctSel").value=d>=0?d:0;
  connectAccount();
}
async function connectAccount(){
  authed=false;if(tw&&!tw.closed)tw.ws.close();
  const a=accts[$("acctSel").value],id=a.account_id||a.id;cur=a.currency||cur;
  status("Connecting "+id+"...");
  try{
    const r=await fetch(`${API}/trading/v1/options/accounts/${id}/otp`,{method:"POST",headers:{Authorization:"Bearer "+token}});
    const j=await r.json();
    if(!j.data||!j.data.url){status("Connect error: "+JSON.stringify(j).slice(0,200));return}
    tw=await mkWS(j.data.url,d=>{
      if(d.msg_type==="balance"&&d.balance){cur=d.balance.currency||cur;status(`Connected: ${id} | ${isDemo(a)?"DEMO":"REAL"} | Balance ${d.balance.balance} ${cur}`)}
    });
    authed=true;send(tw,{balance:1,subscribe:1});
  }catch(e){status("Connect failed: "+e.message)}
}
$("acctSel").onchange=connectAccount;
$("logout").onclick=()=>{sessionStorage.clear();token=null;authed=false;if(tw)tw.ws.close();$("acctBox").classList.add("hide");$("loginBox").classList.remove("hide");status("Logged out.")};

// ---- Analyzer ----
const dg=(p,pip)=>+Number(p).toFixed(pip).slice(-1);
$("scan").onclick=async()=>{
  $("why").textContent="Scanning...";
  try{
    const p=await getPub();
    const d=await ask(p,{ticks_history:$("sym1").value,count:+$("cnt").value,end:"latest",style:"ticks"});
    if(d.error){$("why").textContent=d.error.message;return}
    const pip=d.pip_size,pr=d.history.prices,cnt=Array(10).fill(0);
    pr.forEach(x=>cnt[dg(x,pip)]++);
    const n=pr.length,mx=Math.max(...cnt),mn=Math.min(...cnt);
    $("bars").innerHTML=cnt.map(c=>`<div class="bar ${c===mx?"top":c===mn?"low":""}" style="height:${c/mx*100}%"></div>`).join("");
    $("lbls").innerHTML=cnt.map((c,i)=>`<div>${i}<br>${(c/n*100).toFixed(1)}%</div>`).join("");
    const rec=Array(10).fill(0);pr.slice(-100).forEach(x=>rec[dg(x,pip)]++);
    const sc=cnt.map((c,i)=>c/n+rec[i]/100),best=sc.indexOf(Math.max(...sc));
    $("pred").textContent=best;
    $("why").textContent=`Most frequent in ${n} ticks (${(cnt[best]/n*100).toFixed(1)}%), ${rec[best]}% in last 100. Fair odds are 10%.`;
    $("dig").value=best;$("sym2").value=$("sym1").value;sub();
  }catch(e){$("why").textContent="Scan failed: "+e.message}
};

// ---- Live digit cursor ----
async function sub(){
  const s=$("sym2").value;if(s===subbed)return;
  const p=await getPub();
  if(subbed)send(p,{forget_all:"ticks"});
  subbed=s;send(p,{ticks:s,subscribe:1});
}
$("sym2").onchange=sub;
function onTick(t){
  const d=dg(t.quote,t.pip_size??2),target=+$("dig").value;
  document.querySelectorAll(".cur div").forEach(x=>x.classList.remove("now","hit","t"));
  $("c"+target).classList.add("t");$("c"+d).classList.add("now");
  if(d===target)$("c"+d).classList.add("hit");
  $("last").textContent=`${t.symbol}: ${t.quote} -> digit ${d}`;
  if($("auto").checked&&d===target&&!running&&authed)runTrades();
}

// ---- Bulk trader ----
async function runTrades(){
  if(!authed){log("Log in with Deriv first.");return}
  running=true;stopFlag=false;$("run").disabled=true;
  const n=+$("num").value,stake=+$("stk").value,sym=$("sym2").value,dig=$("dig").value;
  log(`Starting ${n} trade(s): ${sym} matches ${dig}, stake ${stake}`);
  for(let i=1;i<=n&&!stopFlag;i++){
    const b=await ask(tw,{buy:"1",price:stake,parameters:{amount:stake,basis:"stake",contract_type:"DIGITMATCH",currency:cur,duration:1,duration_unit:"t",underlying_symbol:sym,barrier:String(dig)}});
    if(b.error){log("Buy error: "+b.error.message);break}
    const id=b.buy.contract_id;log(`#${i} bought (id ${id})`);
    await new Promise(res=>{
      send(tw,{proposal_open_contract:1,contract_id:id,subscribe:1},d=>{
        if(d.error){log("Result error: "+d.error.message);res();return}
        const c=d.proposal_open_contract;
        if(c&&c.is_sold){
          const p=+c.profit;profit+=p;p>0?wins++:losses++;
          log(`#${i} ${p>0?"WIN":"LOSS"} ${p.toFixed(2)}`);
          $("pl").textContent=`Profit: ${profit.toFixed(2)} | Wins: ${wins} | Losses: ${losses}`;
          if(d.subscription)send(tw,{forget:d.subscription.id});res();
        }
      });
    });
  }
  running=false;$("run").disabled=false;log("Done.");
}
$("run").onclick=runTrades;
$("stop").onclick=()=>{stopFlag=true;$("auto").checked=false;log("Stopped.")};
$("t1").onclick=()=>{$("p1").classList.remove("hide");$("p2").classList.add("hide");$("t1").classList.add("on");$("t2").classList.remove("on")};
$("t2").onclick=()=>{$("p2").classList.remove("hide");$("p1").classList.add("hide");$("t2").classList.add("on");$("t1").classList.remove("on");sub()};

// ---- Start ----
handleCallback().then(ok=>{if(ok)loadAccounts()});
</script>
